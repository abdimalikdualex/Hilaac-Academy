{% extends "admin_portal/base.html" %}
{% block title %}Library{% endblock %}
{% block content %}
<div class="flex justify-between mb-6"><h1 class="text-2xl font-bold">Digital Library</h1><a href="{% url 'admin_portal:library_create' %}" class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm">+ Upload Resource</a></div>
<div class="bg-white rounded-xl border overflow-x-auto">
<table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Title</th><th class="p-3 text-left">Category</th><th class="p-3 text-left">Language</th><th class="p-3"></th></tr></thead>
<tbody>{% for r in resources %}<tr class="border-t"><td class="p-3">{{ r.title }}</td><td class="p-3">{{ r.get_category_display }}</td><td class="p-3">{{ r.language.name }}</td><td class="p-3"><a href="{% url 'admin_portal:library_delete' pk=r.pk %}" class="text-red-600">Delete</a></td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
