{% extends "admin_portal/base.html" %}
{% block title %}Delete {{ object_name }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-red-600 mb-4">Delete {{ object_name }}?</h1>
    <div class="bg-white p-6 rounded-xl border border-red-200 shadow">
        <p class="text-slate-700 mb-2">{{ object_label }}</p>
        {% if warning %}<p class="text-sm text-amber-700 bg-amber-50 rounded-lg p-3 mb-4">{{ warning }}</p>{% endif %}
        <p class="text-sm text-slate-500 mb-6">This action cannot be undone.</p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="px-5 py-2 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700">Yes, Delete</button>
            <a href="{{ cancel_url }}" class="px-5 py-2 border rounded-lg hover:bg-slate-50">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
