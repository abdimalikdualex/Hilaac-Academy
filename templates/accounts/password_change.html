{% extends "base.html" %}
{% block title %}Change Password - Hilaac Academy{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Change Password</h1>
    <form method="post" class="p-6 rounded-2xl bg-white dark:bg-slate-800 shadow border space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div><label class="block text-sm font-medium mb-1">{{ field.label }}</label>{{ field }}<p class="text-red-600 text-sm">{{ field.errors.0 }}</p></div>
        {% endfor %}
        <button type="submit" class="px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Update Password</button>
    </form>
</div>
{% endblock %}
