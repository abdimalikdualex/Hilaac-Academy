{% extends "instructor/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Change Password</h1>
<form method="post" class="bg-white rounded-xl border p-6 max-w-lg space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        <input type="password" name="{{ field.name }}" required class="w-full px-3 py-2 border rounded-lg">
    </div>
    {% endfor %}
    <button type="submit" class="px-5 py-2 bg-primary-600 text-white rounded-lg">Update Password</button>
</form>
{% endblock %}
