{% extends "student/base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Settings</h1>
<div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm max-w-lg">
    <h2 class="font-bold mb-2">Security</h2>
    <p class="text-sm text-slate-600 mb-4">Update your password to keep your account secure.</p>
    <a href="{% url 'student:password_change' %}" class="inline-block px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Change Password</a>
</div>
{% endblock %}
