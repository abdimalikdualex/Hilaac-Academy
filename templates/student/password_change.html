{% extends "student/base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Change Password</h1>
<form method="post" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm max-w-lg space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        {% if field.errors %}<p class="text-red-600 text-sm">{{ field.errors.0 }}</p>{% endif %}
        <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" required class="w-full px-4 py-2 rounded-lg border border-slate-300 outline-none focus:ring-2 focus:ring-primary-500">
    </div>
    {% endfor %}
    <button type="submit" class="px-6 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Update Password</button>
</form>
<p class="mt-4 text-sm"><a href="{% url 'student:settings' %}" class="text-primary-600 hover:underline">← Back to Settings</a></p>
{% endblock %}
