{% extends "emails/base.html" %}
{% block email_body %}
<h1 style="margin:0 0 16px;font-size:22px;color:#0f766e;">{{ title }}</h1>
<p style="margin:0 0 16px;line-height:1.6;color:#334155;">{{ message }}</p>
{% if action_url %}
<p style="margin:0 0 24px;text-align:center;">
    <a href="{{ action_url }}" style="display:inline-block;padding:14px 28px;background:#0f766e;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;">View Details</a>
</p>
{% endif %}
{% endblock %}
