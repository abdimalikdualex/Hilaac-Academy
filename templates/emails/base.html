<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject|default:"Hilaac Academy" }}</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Georgia,'Times New Roman',serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
                    <tr>
                        <td style="background:#0f172a;padding:28px 32px;text-align:center;">
                            <img src="{% if site_url %}{{ site_url }}{% else %}{{ protocol }}://{{ domain }}{% endif %}/static/images/logo.png" alt="Hilaac Academy" width="140" style="display:inline-block;max-width:140px;height:auto;">
                            <p style="margin:12px 0 0;color:#fbbf24;font-size:11px;letter-spacing:0.25em;text-transform:uppercase;">Academy</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            {% block email_body %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b;text-align:center;">
                            <p style="margin:0 0 6px;">&copy; {% now "Y" %} Hilaac Academy. All rights reserved.</p>
                            <p style="margin:0;">info@hilaacacademy.com{% if whatsapp_number %} &nbsp;|&nbsp; {{ whatsapp_number }}{% endif %}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
