{% load ha_icons %}
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wide
    {% if color == 'green' %}bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-300
    {% elif color == 'yellow' %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-300
    {% elif color == 'red' %}bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300
    {% elif color == 'primary' %}bg-primary-100 text-primary-800 dark:bg-primary-900/30 dark:text-primary-300
    {% else %}bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300{% endif %}">
    {% ha_icon icon size=12 class_name="opacity-80" %}
    {{ label }}
</span>
