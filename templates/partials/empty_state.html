{% load ha_icons %}
<div class="text-center py-12 px-4">
    {% if illustration %}
    <img src="{{ illustration }}" alt="" class="mx-auto mb-4 w-40 h-40 object-contain opacity-90" loading="lazy">
    {% else %}
    <div class="mx-auto mb-4 w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
        {% ha_icon "book-open" size=32 %}
    </div>
    {% endif %}
    <h3 class="font-semibold text-lg text-slate-800 dark:text-slate-200">{{ title }}</h3>
    {% if message %}<p class="text-sm text-slate-500 mt-2 max-w-sm mx-auto">{{ message }}</p>{% endif %}
    {% if action_url and action_label %}
    <a href="{{ action_url }}" class="inline-block mt-4 px-5 py-2 bg-primary-600 text-white rounded-lg text-sm font-semibold hover:bg-primary-700">{{ action_label }}</a>
    {% endif %}
</div>
