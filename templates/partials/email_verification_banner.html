{% if REQUIRE_EMAIL_VERIFICATION and user.is_authenticated and user.is_student and not user.is_verified %}
<div class="mb-4 p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-900 text-sm flex flex-wrap items-center justify-between gap-2">
    <span><strong>Your email is not verified.</strong> Please verify your email for full account security.</span>
    <a href="{% url 'accounts:verify_notice' %}" class="text-primary-700 font-semibold hover:underline whitespace-nowrap">Verify email →</a>
</div>
{% endif %}
