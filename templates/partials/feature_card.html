{% load ha_icons performance_tags %}
<article class="rounded-2xl bg-white dark:bg-slate-800 shadow-lg overflow-hidden flex flex-col h-full">
    <div class="aspect-video overflow-hidden bg-slate-100 dark:bg-slate-700">
        {% static_responsive_image image_stem alt=title css_class="w-full h-full object-cover" loading="lazy" %}
    </div>
    <div class="p-5 text-center flex-1 flex flex-col items-center justify-center">
        <div class="flex justify-center mb-2">{% ha_icon icon size=32 class_name="text-primary-600" %}</div>
        <h3 class="font-semibold text-slate-900 dark:text-white">{{ title }}</h3>
        <p class="text-sm text-slate-500 mt-1">{{ subtitle }}</p>
    </div>
</article>
