<span class="inline-flex items-center justify-center shrink-0 {{ class_name }}" style="width:{{ size }}px;height:{{ size }}px"{% if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}>
    <svg xmlns="http://www.w3.org/2000/svg" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">{{ paths|safe }}</svg>
</span>
