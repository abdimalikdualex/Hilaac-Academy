{% if announcements %}
<div class="announcement-ticker" role="region" aria-label="Announcements">
    <div class="announcement-ticker__track">
        {% for _ in "xx" %}
        <div class="announcement-ticker__group" aria-hidden="{% if forloop.counter > 1 %}true{% else %}false{% endif %}">
            {% for announcement in announcements %}
            <span class="announcement-ticker__item" style="background-color: {{ announcement.display_background_color }}; color: {{ announcement.display_text_color }};">
                {% if announcement.link_url %}
                <a href="{{ announcement.link_url }}" class="announcement-ticker__link">{{ announcement.message }}</a>
                {% else %}
                {{ announcement.message }}
                {% endif %}
            </span>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</div>
<style>
.announcement-ticker {
    height: 3rem;
    max-height: 60px;
    overflow: hidden;
    position: relative;
    z-index: 60;
    background-color: #1E4D8F;
}
.announcement-ticker__track {
    display: flex;
    height: 100%;
    width: max-content;
    animation: hilaac-ticker-scroll 55s linear infinite;
    will-change: transform;
}
.announcement-ticker:hover .announcement-ticker__track {
    animation-play-state: paused;
}
.announcement-ticker__group {
    display: flex;
    align-items: stretch;
    height: 100%;
    flex-shrink: 0;
}
.announcement-ticker__item {
    display: inline-flex;
    align-items: center;
    height: 100%;
    padding: 0 2rem;
    font-weight: 700;
    font-size: 0.875rem;
    line-height: 1.25;
    white-space: nowrap;
}
.announcement-ticker__link {
    color: inherit;
    text-decoration: none;
}
.announcement-ticker__link:hover {
    text-decoration: underline;
    text-underline-offset: 2px;
}
@keyframes hilaac-ticker-scroll {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-50%, 0, 0); }
}
@media (max-width: 640px) {
    .announcement-ticker { height: 2.5rem; min-height: 40px; }
    .announcement-ticker__item {
        font-size: 0.8125rem;
        padding: 0 1.25rem;
    }
}
@media (prefers-reduced-motion: reduce) {
    .announcement-ticker__track {
        animation: none;
        width: 100%;
        justify-content: center;
    }
    .announcement-ticker__group:last-child { display: none; }
}
</style>
{% endif %}
