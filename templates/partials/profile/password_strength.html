<script>
(function () {
    var input = document.querySelector('input[name="new_password1"]');
    var bar = document.getElementById("password-strength-bar");
    var label = document.getElementById("password-strength-label");
    if (!input || !bar || !label) return;
    function score(pw) {
        var s = 0;
        if (pw.length >= 8) s++;
        if (/[A-Z]/.test(pw)) s++;
        if (/[a-z]/.test(pw)) s++;
        if (/\d/.test(pw)) s++;
        if (/[^A-Za-z0-9]/.test(pw)) s++;
        return s;
    }
    input.addEventListener("input", function () {
        var pw = input.value;
        var s = score(pw);
        var pct = (s / 5) * 100;
        bar.style.width = pct + "%";
        var colors = ["#DC2626", "#D4A017", "#D4A017", "#0FAE9D", "#0FAE9D"];
        bar.style.backgroundColor = colors[s - 1] || "#DC2626";
        var labels = ["Too weak", "Weak", "Fair", "Good", "Strong"];
        label.textContent = pw ? labels[s - 1] || "Too weak" : "Enter a new password";
    });
})();
</script>
