<script>
(function () {
    var input = document.querySelector("#change-password-form input[name='new_password1']");
    var panel = document.getElementById("password-strength-panel");
    var bar = document.getElementById("password-strength-bar");
    var label = document.getElementById("password-strength-label");
    var message = document.getElementById("password-strength-message");
    if (!input || !panel || !bar || !label) return;

    var rules = {
        length: function (pw) { return pw.length >= 8; },
        upper: function (pw) { return /[A-Z]/.test(pw); },
        lower: function (pw) { return /[a-z]/.test(pw); },
        number: function (pw) { return /\d/.test(pw); },
        special: function (pw) { return /[^A-Za-z0-9]/.test(pw); },
    };

    function updateRules(pw) {
        document.querySelectorAll(".password-rule").forEach(function (row) {
            var key = row.getAttribute("data-rule");
            var ok = rules[key] && rules[key](pw);
            var icon = row.querySelector(".rule-icon");
            row.classList.remove("text-[#64748B]", "text-muted");
            row.classList.toggle("text-[#0FAE9D]", ok);
            row.classList.toggle("text-red-600", !ok);
            if (icon) {
                icon.textContent = ok ? "✓" : "○";
                icon.classList.remove("border-slate-300", "border-red-500", "text-red-600");
                icon.classList.toggle("border-[#0FAE9D]", ok);
                icon.classList.toggle("bg-[#0FAE9D]", ok);
                icon.classList.toggle("text-white", ok);
                icon.classList.toggle("border-red-500", !ok);
                icon.classList.toggle("text-red-600", !ok);
            }
        });
    }

    function score(pw) {
        var passed = 0;
        Object.keys(rules).forEach(function (key) {
            if (rules[key](pw)) passed++;
        });
        return passed;
    }

    input.addEventListener("input", function () {
        var pw = input.value;
        if (!pw) {
            panel.hidden = true;
            message.classList.add("hidden");
            return;
        }
        panel.hidden = false;
        updateRules(pw);
        var s = score(pw);
        var pct = (s / 5) * 100;
        bar.style.width = pct + "%";

        var strengthText = "Weak";
        var color = "#DC2626";
        if (s <= 2) {
            strengthText = "Weak";
            color = "#DC2626";
        } else if (s <= 3) {
            strengthText = "Medium";
            color = "#D4A017";
        } else {
            strengthText = "Strong";
            color = "#0FAE9D";
        }
        bar.style.backgroundColor = color;
        label.textContent = strengthText;
        label.style.color = color;

        if (s >= 5) {
            message.textContent = "Password is strong";
            message.classList.remove("hidden");
            message.style.color = "#0FAE9D";
        } else if (s >= 3) {
            message.textContent = "Password strength is improving";
            message.classList.remove("hidden");
            message.style.color = "#D4A017";
        } else {
            message.textContent = "Password does not meet requirements";
            message.classList.remove("hidden");
            message.style.color = "#DC2626";
        }
    });
})();
</script>
