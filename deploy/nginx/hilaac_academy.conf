# Hilaac Academy — Nginx site config for Ubuntu 24.04.
# Copy to /etc/nginx/sites-available/hilaac_academy and symlink into sites-enabled.
# Adjust server_name, paths, and TLS cert paths to match your VPS.
# Run certbot AFTER the HTTP block works to generate the HTTPS block automatically.

upstream hilaac_app {
    server unix:/run/hilaac/gunicorn.sock;
}

# Gzip compression for text assets
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/font-woff application/font-woff2
    image/svg+xml font/ttf font/otf;

# --- HTTP: redirect everything to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name hilaacacademy.com www.hilaacacademy.com;

    # Allow Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hilaacacademy.com www.hilaacacademy.com;

    # TLS (certbot fills these in; placeholders shown)
    ssl_certificate     /etc/letsencrypt/live/hilaacacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hilaacacademy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large course video uploads
    client_max_body_size 600M;
    client_body_timeout 300s;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Static files (collectstatic output) — served and cached by Nginx
    location /static/ {
        alias /home/hilaac/hilaac-academy/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Public media (thumbnails, covers, profile photos, library, etc.)
    location /media/ {
        alias /home/hilaac/media/;
        expires 7d;
        add_header Cache-Control "public";

        # Block direct access to sensitive uploads — only Django can release them.
        location ~ ^/media/(lessons/videos|lessons/audio|lessons/pdf|lessons/resources|certificates/pdf|payments/screenshots|assignments/submissions)/ {
            internal;
        }
    }

    # Internal handoff target for Django X-Accel-Redirect (protected media)
    location /_protected/ {
        internal;
        alias /home/hilaac/media/;
        # Stream large videos efficiently
        sendfile on;
        tcp_nopush on;
    }

    # Application
    location / {
        proxy_pass http://hilaac_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    error_log  /var/log/nginx/hilaac_error.log;
    access_log /var/log/nginx/hilaac_access.log;
}
